name: Global Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. DIOXUS APPS (cobalt_cloud)
  # -------------------------------------------------------------
  dioxus-web:
    name: Build Cobalt Cloud (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked
      - name: Build Web
        run: cd cobalt_cloud && dx build --release
      - name: Zip Web Build
        run: cd cobalt_cloud/dist && zip -r ../../cobalt-cloud-web.zip .
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: cobalt-cloud-web.zip

  dioxus-desktop:
    name: Build Cobalt Cloud (Desktop)
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: cobalt-cloud-mac.zip
          - os: windows-latest
            artifact_name: cobalt-cloud-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked
      - name: Build Desktop
        run: cd cobalt_cloud && dx build --release --platform desktop
      - name: Zip Desktop Build (Mac)
        if: runner.os == 'macOS'
        run: cd cobalt_cloud/dist && zip -r ../../${{ matrix.artifact_name }} .
      - name: Zip Desktop Build (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path cobalt_cloud/dist/* -DestinationPath ${{ matrix.artifact_name }}
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}

  # Note: Dioxus Android APK building via GitHub Actions requires complex NDK setup.
  # We provide instructions for it in the README, but automated builds focus on Desktop/Web.

  # -------------------------------------------------------------
  # 2. FLUTTER APPS (cobaltweb)
  # -------------------------------------------------------------
  flutter-apps:
    name: Build CobaltWeb (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: cd cobalt_frontend/web/cobaltweb && flutter pub get
      - name: Build Web
        run: cd cobalt_frontend/web/cobaltweb && flutter build web --release
      - name: Zip Web Build
        run: cd cobalt_frontend/web/cobaltweb/build/web && zip -r ../../../../../cobaltweb-web.zip .
      - name: Build APK
        run: cd cobalt_frontend/web/cobaltweb && flutter build apk --release
      - name: Copy APK
        run: cp cobalt_frontend/web/cobaltweb/build/app/outputs/flutter-apk/app-release.apk cobaltweb-android.apk
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cobaltweb-web.zip
            cobaltweb-android.apk

  # -------------------------------------------------------------
  # 3. RUST BACKENDS (cobalt_backend/cloud)
  # -------------------------------------------------------------
  rust-backends:
    name: Build Cobalt Backend
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cobalt-backend-linux
            target: x86_64-unknown-linux-gnu
            binary_path: target/x86_64-unknown-linux-gnu/release/cloud
          - os: windows-latest
            artifact_name: cobalt-backend-windows.exe
            target: x86_64-pc-windows-msvc
            binary_path: target/x86_64-pc-windows-msvc/release/cloud.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Backend
        run: cargo build --release --manifest-path cobalt_backend/cloud/Cargo.toml --target ${{ matrix.target }}
      - name: Rename Binary (Linux)
        if: runner.os == 'Linux'
        run: mv ${{ matrix.binary_path }} ${{ matrix.artifact_name }}
      - name: Rename Binary (Windows)
        if: runner.os == 'Windows'
        run: mv ${{ matrix.binary_path }} ${{ matrix.artifact_name }}
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
