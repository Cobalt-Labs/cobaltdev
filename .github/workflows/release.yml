name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.6.0-alpha.2 # Depending on your dx version, adjust if needed
      - name: Build Web
        run: cd cobalt_cloud && dx build --release --platform web
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: cobalt_cloud/dist/

  build-desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli
      - name: Build Desktop
        run: cd cobalt_cloud && dx build --release --platform desktop
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-${{ matrix.os }}
          path: cobalt_cloud/dist/
