[workspace]
resolver = "2"
members = [
    "cobalt_backend/cloud", 
    "cobalt_backend/multidb",
    "cobalt_backend/sync", 
    "cobalt_cloud",
    "cobalt_ai", 
    "cobalt_ai/rig_agent", 
    "cobalt_ai/experiments/scratch_model",
    "cobalt_systems/userland/minigrep", 
    "cobalt_embedded",
    # "cobalt_frontend/web/fullstack_app",
    "cobalt_frontend/web/fullstack_app/dioxus",
    "cobalt_frontend/app/encrypt_notepad/notepad/native", 
    "examples/test_code_rust", "cobalt_backend/multidb", 
]

# Unified workspace dependencies
[workspace.dependencies]
# Use the same version across all crates
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "any", "chrono", "uuid", "migrate", "mysql"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.8", features = ["multipart", "tracing"] }

# Other shared dependencies
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
