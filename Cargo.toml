[workspace]
resolver = "2"
members = [
    "cobalt_backend/cloud", 
    "cobalt_backend/sync", 
    "cobalt_cloud",
    "cobalt_ai", 
    "cobalt_ai/rig_agent", 
]

# Unified workspace dependencies
[workspace.dependencies]
# Web & Async runtime
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.8", features = ["multipart", "tracing"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "any", "chrono", "uuid", "migrate", "mysql"] }

# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
