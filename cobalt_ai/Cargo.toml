[package]
name = "cobalt_ai"
version = "1.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
linfa = "0.8.1"
linfa-clustering = "0.8.1"
rand = "0.10.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
burn = { version = "0.20.1", features = ["std", "tui", "train", "vision", "wgpu", "fusion"], default-features = false }
tokenizers = "0.22.2"

# run this cmd to run the ai
# cargo run --manifest-path cobalt_ai/Cargo.toml
# 
# burn = { version = "0.12", features = ["wgpu", "train", "autodiff"] }
rand = "0.8"
rand_xoshiro = "0.6"
ndarray = "0.15"
ndarray-rand = "0.14"
linfa = "0.7"
linfa-trees = "0.7"

# Add these for random sampling
rand = "0.8"