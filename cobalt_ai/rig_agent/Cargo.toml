[package]
name = "rig_agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
async-trait = "0.1.89"
candle-core = "0.10.2"
candle-transformers = "0.10.2"
config = "0.15.23"
dotenv = "0.15.0"
futures = "0.3.32"
governor = "0.10.4"
moka = "0.12.15"
pdf-extract = "0.10.0"
qdrant-client = "1.18.0"
reqwest = { version = "0.13.3", features = ["json"] }
rig-core = "0.37.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
toml = "1.1.2"
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "rig_cli"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.0"