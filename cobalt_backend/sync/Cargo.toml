[package]
name = "cobalt-sync"
version = "0.1.0"
edition = "2024"
authors = ["Ibrahim Haji"]
description = "Cobalt Sync - Async file watcher and S3-compatible backup/sync daemon"
license = "MIT OR Apache-2.0"

# Binary
[[bin]]
name = "cobalt-sync"
path = "src/bin/sync/main.rs"

# Library (for reuse in Dioxus, CLI, etc.)
[lib]
name = "cobalt_sync"
path = "src/lib.rs"

[dependencies]
# Core
tokio = { workspace = true }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File watching
notify = { version = "8.0", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Object Storage (very flexible)
opendal = { version = "0.51", features = ["services-s3", "services-fs"] }

# Config
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"