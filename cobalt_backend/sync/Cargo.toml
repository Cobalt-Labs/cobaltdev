[package]
name = "cobalt-sync"
version = "0.1.0"
edition = "2024"
authors = ["Ibrahim Haji"]
description = "Cobalt Sync - Async file watcher and S3-compatible backup/sync daemon"
license = "MIT OR Apache-2.0"

# Binary
[[bin]]
name = "cobalt-sync"
path = "src/bin/sync/main.rs"

# Library (for reuse in Dioxus, CLI, etc.)
[lib]
name = "cobalt_sync"
path = "src/lib.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# File watching
notify = { version = "8.0", features = ["serde"] }

# Object Storage
opendal = { version = "0.51", features = ["services-s3", "services-fs"] }
