[package]
name = "cobalt_cloud"
version = "1.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dioxus = { version = "0.7", features = ["web", "router", "signals", "asset"] }
dioxus-logger = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4", "js"] }
futures-timer = "3.0.3"

# Base reqwest - use rustls for cross-platform compatibility
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "full"] }
# FIXED: Changed 0.13.2 back to 0.12 to match
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
dioxus = { version = "0.7", features = ["desktop", "mobile"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["rt"] }
reqwest = { version = "0.12" }
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }