[package]
name = "cobalt_cloud"
version = "1.1.0"
edition = "2021"

[dependencies]
# Workspace dependencies
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["js"] }

# UI Framework
dioxus = { version = "0.7", features = ["web", "router", "signals", "asset"] }
dioxus-logger = "0.6"

# Base reqwest - use rustls for cross-platform compatibility
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
dioxus = { version = "0.7", features = ["desktop", "mobile"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["rt"] }
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
