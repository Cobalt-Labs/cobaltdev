<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <!-- Primary Meta Tags -->
  <title>Cobalt | Premium Portfolio & Services</title>
  <meta name="title" content="Cobalt | Premium Portfolio & Services">
  <meta name="description" content="Explore Cobalt's elite portfolio and premium services. Built for extreme scalability, performance, and best-in-class user experience.">
  <meta name="keywords" content="Cobalt, Portfolio, Services, Software Development, Web Development, Elite Design, High Performance">
  <meta name="author" content="Cobalt">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07070F">
  
  <!-- Preconnect & DNS-Prefetch for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cobaltdev.com/">
  <meta property="og:title" content="Cobalt | Premium Portfolio & Services">
  <meta property="og:description" content="Explore Cobalt's elite portfolio and premium services. Built for extreme scalability, performance, and best-in-class user experience.">
  <meta property="og:image" content="https://cobaltdev.com/assets/images/cobalt_logo.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://cobaltdev.com/">
  <meta property="twitter:title" content="Cobalt | Premium Portfolio & Services">
  <meta property="twitter:description" content="Explore Cobalt's elite portfolio and premium services. Built for extreme scalability, performance, and best-in-class user experience.">
  <meta property="twitter:image" content="https://cobaltdev.com/assets/images/cobalt_logo.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cobalt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Cobalt",
    "url": "https://cobaltdev.com/",
    "logo": "https://cobaltdev.com/assets/images/cobalt_logo.png",
    "description": "Elite software portfolio and premium technology services.",
    "sameAs": [
      "https://twitter.com/cobaltdev",
      "https://github.com/cobaltdev"
    ]
  }
  </script>

  <link rel="manifest" href="manifest.json">
  <!-- Use defer for non-critical scripts to prevent parser blocking -->
  <script src="https://cdn.jsdelivr.net/gh/gzuidhof/coi-serviceworker@latest/coi-serviceworker.min.js" defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
