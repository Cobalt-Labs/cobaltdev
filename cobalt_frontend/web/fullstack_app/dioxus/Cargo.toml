[package]
name = "cobalt-dioxus"
version = "0.1.0"
authors = ["Ibrahim <98814268+ibrahim-3595@users.noreply.github.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.9", features = ["fullstack", "router"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[package.metadata.dioxus]
app_name = "cobalt-dioxus"

[features]
default = ["web"]
# The feature that are only required for the web build target
web = ["dioxus/web"]
# The feature that are only required for the desktop build target
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile build target
mobile = ["dioxus/mobile"]
# The feature that are only required for the server build target
server = ["dioxus/server"]
