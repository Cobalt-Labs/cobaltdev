[package]
name = "rust_js"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
dotenvy = "0.15"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"

# For serving static files
include_dir = "0.7"

[profile.release]
opt-level = 3
lto = true