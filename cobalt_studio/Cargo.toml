[package]
name = "cobalt_studio"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI Framework
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-logger = "0.6"
tracing = "0.1"

# Our shared library
cobalt_shared = { path = "../cobalt_shared" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# File watching for live reload
notify = "6.1"

# Terminal colors
console = "0.15"

[build-dependencies]
# Only needed if using Tauri, but we're using Dioxus